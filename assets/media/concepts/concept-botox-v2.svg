<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024"
 viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Botox — perfil elegante com regiões de expressão destacadas</title><desc id="desc">Perfil feminino abstrato com faixas luminosas na testa, glabela e laterais dos olhos, sem injeções ou dosagens.</desc>

<defs>
