<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024"
 viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Tapping terapêutico — gesto de toque em composição corporal elegante</title><desc id="desc">Antebraço e mão em composição elegante, com dedos profissionais e marcas abstratas do gesto de tapping, sem fitas ou materiais.</desc>

<defs>
