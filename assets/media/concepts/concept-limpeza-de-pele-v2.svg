 fill="url(#drop)" opacity=".88"/>
<ellipse cx="1090" cy="447" rx="16" ry="28" transform="rotate(28 1090 447)" fill="#fffdf6" opacity=".7"/>
<circle cx="1300" cy="507" r="30" fill="url(#pearl)"/>
<circle cx="1226" cy="603" r="18" fill="url(#drop)"/>
</g><g ><path d="M330 381H372V254" fill="none" stroke="#75515a" stroke-width="1.5" opacity=".66"/><text x="390" y="262" fill="#75515a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" letter-spacing="1.5" opacity="1">LIMPEZA</text></g><g ><path d="M1050 324H1058V230" fill="none" stroke="#75515a" stroke-width="1.5" opacity=".66"/><text x="1040" y="238" fill="#75515a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="end" letter-spacing="1.5" opacity="1">TEXTURA NATURAL</text></g><g ><path d="M1056 600H1028V854" fill="none" stroke="#75515a" stroke-width="1.5" opacity=".66"/><text x="1010" y="862" fill="#75515a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="end" letter-spacing="1.5" opacity="1">ESFERA DE CUIDADO</text></g>
<g opacity="0.9"><path d="M1212 932H1460" stroke="#815a3d" stroke-width="1" opacity=".5"/><text x="1460" y="916" fill="#815a3d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="end" letter-spacing="2.8" opacity="1">PELE · TEXTURA · CUIDADO</text></g>
