<ellipse cx="213" cy="703" rx="107" ry="32" fill="url(#satin)"/>
<ellipse cx="213" cy="698" rx="91" ry="22" fill="#f6e8df"/>
<path d="M128 721c45 13 122 14 170 0" stroke="#fffaf0" stroke-width="8" opacity=".58"/>
</g><g filter="url(#shadow)">
<path d="M390 1024V404C390 214 742 108 1052 197c273 78 484 272 484 514v313Z" fill="url(#skinGlow)"/>
<path d="M402 858c205-179 419-196 633-126 239 78 356 38 501-45" fill="none"
 stroke="#fcece2" stroke-width="46" opacity=".31"/>
<path d="M433 950c225-135 447-155 653-83 186 65 318 35 450-30" fill="none"
 stroke="#9f5f73" stroke-width="22" opacity=".13"/>
<path d="M505 690c176-106 325-121 504-56 170 62 319 48 527-68" fill="none"
 stroke="#fff5e9" stroke-width="18" opacity=".32"/>
<path d="M390 1024V404C390 214 742 108 1052 197c273 78 484 272 484 514v313Z" fill="url(#pores)"/>
</g><g filter="url(#shadow)">
