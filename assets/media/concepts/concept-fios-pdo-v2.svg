    stop-color="#e8bdc3" stop-opacity=".68"/><stop offset="1"
    stop-color="#a45f65" stop-opacity=".84"/></linearGradient>
  <linearGradient id="lip" x1=".2" y1="0" x2=".78" y2="1">
