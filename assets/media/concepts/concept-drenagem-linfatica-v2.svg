<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024"
 viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Drenagem linfática — silhueta de membro inferior e fluxo conceitual</title><desc id="desc">Silhueta abstrata de perna com setas luminosas de fluxo, sem alegação médica ou representação de vasos.</desc>

<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f8f3ee"/><stop offset=".52" stop-color="#efe5df"/>
    <stop offset="1" stop-color="#dfb9bd"/>
  </linearGradient>
  <radialGradient id="halo"><stop stop-color="#fff9ed" stop-opacity=".96"/>
    <stop offset=".54" stop-color="#ecd8b3" stop-opacity=".28"/>
    <stop offset="1" stop-color="#ecd8b3" stop-opacity="0"/></radialGradient>
  <linearGradient id="night" x1="0" y1="0" x2=".9" y2="1">
    <stop stop-color="#5c3546"/><stop offset=".54" stop-color="#2d1722"/>
    <stop offset="1" stop-color="#1d1118"/></linearGradient>
  <linearGradient id="skin" x1=".12" y1=".02" x2=".92" y2=".98">
    <stop stop-color="#fff4e9"/><stop offset=".28" stop-color="#f1d1c9"/>
    <stop offset=".62" stop-color="#d59a9e"/><stop offset=".86" stop-color="#b87582"/>
    <stop offset="1" stop-color="#875363"/></linearGradient>
  <radialGradient id="skinGlow" cx=".34" cy=".24" r=".84">
    <stop stop-color="#fff9ef"/><stop offset=".35" stop-color="#f4dcd2"/>
    <stop offset=".73" stop-color="#dca5aa"/><stop offset="1" stop-color="#a56878"/></radialGradient>
  <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f7e6dc"/><stop offset=".43" stop-color="#dfa9aa"/>
    <stop offset="1" stop-color="#9e6173"/></linearGradient>
  <linearGradient id="pearl" x1=".05" y1=".06" x2=".95" y2=".9">
    <stop stop-color="#fffdf6"/><stop offset=".22" stop-color="#f7e8dd"/>
    <stop offset=".5" stop-color="#e6c6cf"/><stop offset=".74" stop-color="#b88ca7"/>
    <stop offset="1" stop-color="#765064"/></linearGradient>
  <linearGradient id="satin" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff4df"/><stop offset=".24" stop-color="#ecd8b3"/>
    <stop offset=".5" stop-color="#b88b62"/><stop offset=".68" stop-color="#ecd5ad"/>
    <stop offset="1" stop-color="#815a3d"/></linearGradient>
  <linearGradient id="lilacGlass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fffaf3" stop-opacity=".94"/><stop offset=".38"
    stop-color="#e8ddf0" stop-opacity=".78"/><stop offset=".72"
    stop-color="#c6b1d2" stop-opacity=".62"/><stop offset="1"
    stop-color="#805c82" stop-opacity=".82"/></linearGradient>
  <linearGradient id="roseGlass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff5ed" stop-opacity=".9"/><stop offset=".45"
    stop-color="#e8bdc3" stop-opacity=".68"/><stop offset="1"
    stop-color="#a45f65" stop-opacity=".84"/></linearGradient>
  <linearGradient id="lip" x1=".2" y1="0" x2=".78" y2="1">
    <stop stop-color="#f4c8c2"/><stop offset=".3" stop-color="#d98994"/>
    <stop offset=".66" stop-color="#b45e72"/><stop offset="1" stop-color="#773b54"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6e4852"/><stop offset=".38" stop-color="#3c2531"/>
    <stop offset=".7" stop-color="#241821"/><stop offset="1" stop-color="#5a3845"/></linearGradient>
  <radialGradient id="drop" cx=".35" cy=".22" r=".85">
    <stop stop-color="#fffdf5"/><stop offset=".3" stop-color="#eadff0"/>
    <stop offset=".62" stop-color="#c5b5d5"/><stop offset=".84" stop-color="#9f7cae"/>
    <stop offset="1" stop-color="#684b78"/></radialGradient>
  <pattern id="pores" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="9" r="1.5" fill="#8b5868" opacity=".14"/>
    <circle cx="25" cy="23" r="1.1" fill="#8b5868" opacity=".12"/>
    <circle cx="18" cy="4" r=".8" fill="#fff7ef" opacity=".65"/>
  </pattern>
  <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ecd8b3" stroke-width=".6" opacity=".12"/>
  </pattern>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="23"/>
    <feOffset dy="24"/><feColorMatrix values="0 0 0 0 .17 0 0 0 0 .07 0 0 0 0 .12 0 0 0 .28 0"/>
    <feBlend in="SourceGraphic"/></filter>
  <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/>
    <feColorMatrix values="0 0 0 0 .17 0 0 0 0 .07 0 0 0 0 .12 0 0 0 .25 0"/>
    <feBlend in="SourceGraphic"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72"
    numOctaves="3" seed="19" result="noise"/><feColorMatrix in="noise"
    values="0 0 0 0 .25 0 0 0 0 .14 0 0 0 0 .18 0 0 0 .038 0"/>
    <feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs>
