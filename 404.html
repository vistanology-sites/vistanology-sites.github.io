<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Página não encontrada — Aline Rodrigues</title>
  <link rel="icon" href="/assets/logo-dourado.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("/assets/fonts/inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("/assets/fonts/cormorant-garamond-latin.woff2") format("woff2");
      font-weight: 400 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8f3ee;
      color: #2b2118;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
      padding: 32px;
    }
    main { max-width: 460px; }
    img { width: 72px; height: 72px; object-fit: contain; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2rem, 6vw, 2.75rem);
      line-height: 1.1;
      margin: 24px 0 12px;
    }
    p { margin: 0 0 24px; color: #6b5d50; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #2b2118;
      color: #f8f3ee;
      text-decoration: none;
      font-size: .9rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    a:hover { background: #46372a; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/media/logo-simbolo.webp" alt="Aline Rodrigues">
